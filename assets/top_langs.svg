<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 195" width="450" height="195">
  <defs>
    <linearGradient id="langBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07080c"/>
      <stop offset="100%" stop-color="#120e14"/>
    </linearGradient>

    <style>
      .lang-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 15px;
        fill: #ff1e27;
        letter-spacing: 1.5px;
      }
      .lang-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #f1f5f9;
      }
      .lang-pct {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 12px;
        fill: #cbd5e1;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="448" height="193" x="1" y="1" rx="10" fill="url(#langBg)" stroke="#ff1e27" stroke-width="1.8" stroke-opacity="0.8"/>

  <!-- High-Tech Corner HUD Brackets -->
  <g stroke="#ffd700" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 8 20 L 8 8 L 20 8"/>
    <path d="M 440 20 L 440 8 L 428 8"/>
    <path d="M 8 174 L 8 186 L 20 186"/>
    <path d="M 440 174 L 440 186 L 428 186"/>
  </g>

  <!-- Card Header -->
  <g transform="translate(25, 32)">
    <circle cx="6" cy="-2" r="4" fill="#ff1e27"/>
    <circle cx="6" cy="-2" r="2" fill="#ffd700"/>
    <text x="20" y="2" class="lang-title">ROYAL COMPILATION // TOP STACK</text>
  </g>

  <!-- Top Aggregate Progress Bar -->
  <g transform="translate(25, 52)">
    <rect width="400" height="10" rx="5" fill="#201115"/>
    <!-- Python Segment -->
    <rect x="0" y="0" width="150" height="10" rx="5" fill="#ff1e27"/>
    <!-- TypeScript Segment -->
    <rect x="145" y="0" width="130" height="10" fill="#b91c1c"/>
    <!-- HTML/CSS Segment -->
    <rect x="270" y="0" width="75" height="10" fill="#ffd700"/>
    <!-- JS & Others Segment -->
    <rect x="340" y="0" width="60" height="10" rx="5" fill="#f43f5e"/>
  </g>

  <!-- Language List Grid -->
  <g transform="translate(30, 88)">
    <!-- Column 1 -->
    <!-- Python -->
    <g transform="translate(0, 0)">
      <circle cx="5" cy="5" r="5" fill="#ff1e27"/>
      <text x="18" y="9" class="lang-name">Python</text>
      <text x="130" y="9" class="lang-pct">37.5%</text>
    </g>
    <!-- TypeScript -->
    <g transform="translate(0, 32)">
      <circle cx="5" cy="5" r="5" fill="#b91c1c"/>
      <text x="18" y="9" class="lang-name">TypeScript</text>
      <text x="130" y="9" class="lang-pct">32.5%</text>
    </g>
    <!-- HTML5 / CSS3 -->
    <g transform="translate(0, 64)">
      <circle cx="5" cy="5" r="5" fill="#ffd700"/>
      <text x="18" y="9" class="lang-name">HTML / CSS</text>
      <text x="130" y="9" class="lang-pct">18.0%</text>
    </g>

    <!-- Column 2 -->
    <!-- JavaScript -->
    <g transform="translate(200, 0)">
      <circle cx="5" cy="5" r="5" fill="#f43f5e"/>
      <text x="18" y="9" class="lang-name">JavaScript</text>
      <text x="125" y="9" class="lang-pct">7.0%</text>
    </g>
    <!-- Java & C -->
    <g transform="translate(200, 32)">
      <circle cx="5" cy="5" r="5" fill="#f59e0b"/>
      <text x="18" y="9" class="lang-name">Java &amp; C</text>
      <text x="125" y="9" class="lang-pct">5.0%</text>
    </g>
  </g>
</svg>