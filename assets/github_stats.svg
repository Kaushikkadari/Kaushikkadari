<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 195" width="450" height="195">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#0d131f"/>
    </linearGradient>

    <linearGradient id="spiderRedGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="100%" stop-color="#d50000"/>
    </linearGradient>

    <filter id="hudGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .card-title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 16px;
        fill: #e62429;
        letter-spacing: 1.5px;
      }
      .stat-label {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 13px;
        fill: #94a3b8;
      }
      .stat-value {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 700;
        font-size: 14px;
        fill: #e2e8f0;
      }
      .rank-circle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 900;
        font-size: 24px;
        fill: #00d2ff;
      }
      .rank-sub {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 9px;
        fill: #e62429;
        letter-spacing: 1px;
      }
      @keyframes pulseRing {
        0%, 100% { stroke: #00d2ff; }
        50% { stroke: #e62429; }
      }
      .pulse-ring {
        animation: pulseRing 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="448" height="193" x="1" y="1" rx="10" fill="url(#cardBg)" stroke="#e62429" stroke-width="1.8"/>

  <!-- High-Tech Corner HUD Brackets -->
  <g stroke="#00d2ff" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 8 20 L 8 8 L 20 8"/>
    <path d="M 440 20 L 440 8 L 428 8"/>
    <path d="M 8 174 L 8 186 L 20 186"/>
    <path d="M 440 174 L 440 186 L 428 186"/>
  </g>

  <!-- Card Header -->
  <g transform="translate(25, 32)">
    <!-- Spider Icon -->
    <ellipse cx="6" cy="0" rx="3.5" ry="4.5" fill="#e62429"/>
    <circle cx="6" cy="-6" r="2.5" fill="#ffffff"/>
    <path d="M 3 -4 L -2 -8 M 3 -1 L -3 -1 M 3 2 L -2 6" stroke="#e62429" stroke-width="1" fill="none"/>
    <path d="M 9 -4 L 14 -8 M 9 -1 L 15 -1 M 9 2 L 14 6" stroke="#e62429" stroke-width="1" fill="none"/>
    <text x="24" y="2" class="card-title">SPIDER-TELEMETRY // STATS</text>
  </g>

  <!-- Stats Rows -->
  <g transform="translate(30, 68)">
    <!-- Stat 1: Total Stars -->
    <g transform="translate(0, 0)">
      <circle cx="4" cy="-4" r="3" fill="#00d2ff"/>
      <text x="16" y="0" class="stat-label">Total Stars Earned:</text>
      <text x="195" y="0" class="stat-value">10 ★</text>
    </g>

    <!-- Stat 2: Total Commits & Contributions -->
    <g transform="translate(0, 26)">
      <circle cx="4" cy="-4" r="3" fill="#e62429"/>
      <text x="16" y="0" class="stat-label">Total Contributions:</text>
      <text x="195" y="0" class="stat-value">97+ [ACTIVE]</text>
    </g>

    <!-- Stat 3: Public Repositories -->
    <g transform="translate(0, 52)">
      <circle cx="4" cy="-4" r="3" fill="#00d2ff"/>
      <text x="16" y="0" class="stat-label">Public Repositories:</text>
      <text x="195" y="0" class="stat-value">8 Projects</text>
    </g>

    <!-- Stat 4: Production Deployments -->
    <g transform="translate(0, 78)">
      <circle cx="4" cy="-4" r="3" fill="#e62429"/>
      <text x="16" y="0" class="stat-label">Live Cloud Deployments:</text>
      <text x="195" y="0" class="stat-value">5 Verified</text>
    </g>
  </g>

  <!-- Rank Gauge on Right -->
  <g transform="translate(365, 110)">
    <!-- Outer Glow Ring -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#172238" stroke-width="6"/>
    <circle cx="0" cy="0" r="42" fill="none" stroke="#00d2ff" stroke-width="5" stroke-dasharray="210 264" class="pulse-ring"/>
    <circle cx="0" cy="0" r="34" fill="#080c14" stroke="#e62429" stroke-width="1.5"/>
    <text x="0" y="6" text-anchor="middle" class="rank-circle-text">A+</text>
    <text x="0" y="20" text-anchor="middle" class="rank-sub">SLINGER</text>
  </g>
</svg>
