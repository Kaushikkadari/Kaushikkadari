<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="140" height="224">
  <defs>
    <!-- Web Line Glow -->
    <filter id="webGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="suitRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e38"/>
      <stop offset="70%" stop-color="#d61428"/>
      <stop offset="100%" stop-color="#9e0c1b"/>
    </linearGradient>

    <linearGradient id="suitBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc"/>
      <stop offset="70%" stop-color="#0b3875"/>
      <stop offset="100%" stop-color="#061f42"/>
    </linearGradient>

    <style>
      @keyframes swingPendulum {
        0% { transform: rotate(-14deg); }
        50% { transform: rotate(14deg); }
        100% { transform: rotate(-14deg); }
      }
      @keyframes eyeGlow {
        0%, 100% { fill: #ffffff; filter: drop-shadow(0 0 2px #00d2ff); }
        50% { fill: #cbefff; filter: drop-shadow(0 0 5px #00d2ff); }
      }
      .pendulum-group {
        animation: swingPendulum 3.6s ease-in-out infinite;
        transform-origin: 100px 0px;
      }
      .spider-eye {
        animation: eyeGlow 2.5s ease-in-out infinite;
      }
    </style>
  </defs>

  <g class="pendulum-group">
    <!-- Silk Web Thread from Ceiling -->
    <line x1="100" y1="0" x2="100" y2="175" stroke="#f0f6fc" stroke-width="1.8" filter="url(#webGlow)" opacity="0.95"/>
    <line x1="99" y1="0" x2="99" y2="175" stroke="#00d2ff" stroke-width="0.8" opacity="0.6"/>

    <!-- Hanging Upside-Down Spider-Man Group -->
    <g transform="translate(100, 205)">
      <!-- Feet clinging to thread (at top) -->
      <!-- Legs bent in classic inverted V -->
      <!-- Left Leg (Blue/Red boot) -->
      <path d="M 0 -30 Q -18 -20 -22 -2 Q -15 8 -10 16" fill="none" stroke="url(#suitBlue)" stroke-width="7" stroke-linecap="round"/>
      <path d="M 0 -30 Q -10 -25 -5 -15" fill="none" stroke="url(#suitRed)" stroke-width="6" stroke-linecap="round"/>

      <!-- Right Leg (Blue/Red boot) -->
      <path d="M 0 -30 Q 18 -20 22 -2 Q 15 8 10 16" fill="none" stroke="url(#suitBlue)" stroke-width="7" stroke-linecap="round"/>
      <path d="M 0 -30 Q 10 -25 5 -15" fill="none" stroke="url(#suitRed)" stroke-width="6" stroke-linecap="round"/>

      <!-- Torso (Upside down, Red & Blue) -->
      <ellipse cx="0" cy="22" rx="13" ry="16" fill="url(#suitRed)"/>
      <path d="M -13 14 Q -7 22 -13 32 Q -10 34 -4 34 Q -4 14 -13 14 Z" fill="url(#suitBlue)"/>
      <path d="M 13 14 Q 7 22 13 32 Q 10 34 4 34 Q 4 14 13 14 Z" fill="url(#suitBlue)"/>

      <!-- Spider Emblem on Chest -->
      <ellipse cx="0" cy="22" rx="2" ry="3" fill="#111111"/>
      <path d="M -1 20 L -5 16 M -1 22 L -6 22 M -1 24 L -5 27" stroke="#111111" stroke-width="0.8"/>
      <path d="M 1 20 L 5 16 M 1 22 L 6 22 M 1 24 L 5 27" stroke="#111111" stroke-width="0.8"/>

      <!-- Arms crossed or reaching down -->
      <!-- Left Arm -->
      <path d="M -11 16 Q -22 28 -14 38 Q -8 34 -3 28" fill="none" stroke="url(#suitRed)" stroke-width="5" stroke-linecap="round"/>
      <!-- Right Arm -->
      <path d="M 11 16 Q 22 28 14 38 Q 8 34 3 28" fill="none" stroke="url(#suitRed)" stroke-width="5" stroke-linecap="round"/>

      <!-- Head (Inverted, chin up / forehead down) -->
      <ellipse cx="0" cy="46" rx="12" ry="14" fill="url(#suitRed)"/>
      <!-- Web pattern on mask -->
      <path d="M 0 32 L 0 60 M -12 46 L 12 46" stroke="#220508" stroke-width="0.7" opacity="0.6"/>
      <ellipse cx="0" cy="46" rx="6" ry="7" fill="none" stroke="#220508" stroke-width="0.7" opacity="0.6"/>

      <!-- Classic Angular White Eyes with Black Borders -->
      <!-- Left Eye -->
      <path d="M -3 42 Q -8 40 -10 47 Q -6 51 -2 46 Z" fill="#ffffff" stroke="#111111" stroke-width="1.8" class="spider-eye"/>
      <!-- Right Eye -->
      <path d="M 3 42 Q 8 40 10 47 Q 6 51 2 46 Z" fill="#ffffff" stroke="#111111" stroke-width="1.8" class="spider-eye"/>
    </g>
  </g>
</svg>
