<svg viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0A1626"/>
      <stop offset="55%" stop-color="#0D2438"/>
      <stop offset="100%" stop-color="#0B3D4C"/>
    </linearGradient>

    <linearGradient id="duneBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123249"/>
      <stop offset="100%" stop-color="#0E2536"/>
    </linearGradient>

    <linearGradient id="duneMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0C2536"/>
      <stop offset="100%" stop-color="#081826"/>
    </linearGradient>

    <linearGradient id="duneFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071826"/>
      <stop offset="100%" stop-color="#04101B"/>
    </linearGradient>

    <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5CE8FF" stop-opacity="0.55"/>
    </linearGradient>

    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FE9FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8FE9FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect x="0" y="0" width="1200" height="300" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#BFEFFF" opacity="0.55">
    <circle cx="80" cy="40" r="1.3"/>
    <circle cx="150" cy="70" r="1"/>
    <circle cx="230" cy="35" r="1.5"/>
    <circle cx="320" cy="60" r="1"/>
    <circle cx="410" cy="30" r="1.2"/>
    <circle cx="520" cy="50" r="1"/>
    <circle cx="640" cy="25" r="1.4"/>
    <circle cx="760" cy="55" r="1"/>
    <circle cx="880" cy="35" r="1.3"/>
    <circle cx="980" cy="65" r="1"/>
    <circle cx="1060" cy="30" r="1.5"/>
    <circle cx="1140" cy="55" r="1"/>
  </g>

  <!-- moon / glow -->
  <circle cx="1000" cy="70" r="60" fill="url(#moonGlow)"/>
  <circle cx="1000" cy="70" r="22" fill="#DFF9FF"/>

  <!-- back dune layer -->
  <path d="M0,180 C120,140 200,150 300,165 C420,182 480,140 600,150 C720,160 800,130 900,145 C1020,162 1100,150 1200,160 L1200,300 L0,300 Z" fill="url(#duneBack)"/>

  <!-- mid dune layer -->
  <path d="M0,215 C100,190 220,200 320,215 C440,232 520,195 640,205 C760,215 840,190 960,205 C1060,217 1140,205 1200,210 L1200,300 L0,300 Z" fill="url(#duneMid)"/>

  <!-- winding river -->
  <path d="M600,300 C580,255 630,230 600,195 C575,168 615,150 600,120 C588,98 605,80 600,60" fill="none" stroke="url(#river)" stroke-width="7" stroke-linecap="round" opacity="0.8"/>

  <!-- front dune layer -->
  <path d="M0,250 C140,225 260,245 360,255 C480,267 560,235 680,245 C800,255 900,230 1020,245 C1100,255 1160,248 1200,250 L1200,300 L0,300 Z" fill="url(#duneFront)"/>

  <!-- hero text -->
  <text x="600" y="130" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="34" font-weight="600" fill="#E6FBFF">
    Welcome to Kaushik's GitHub
  </text>
  <text x="600" y="164" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="18" fill="#00D9FF" opacity="0.9">
    Data Science &amp; AI — turning data into decisions
  </text>
  <text x="600" y="196" text-anchor="middle" font-family="'Fira Code', 'Courier New', monospace" font-size="20" fill="#5CE8FF" opacity="0.75">
    &lt;/&gt;
  </text>
</svg>
