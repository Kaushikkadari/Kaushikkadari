<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06080e"/>
      <stop offset="50%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Glowing Red Gradient -->
    <linearGradient id="redGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#e62429"/>
      <stop offset="100%" stop-color="#b71c1c"/>
    </linearGradient>

    <!-- Cyber Cyan Gradient -->
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="100%" stop-color="#00b4d8"/>
    </linearGradient>

    <!-- Radial Glow for Spider Core -->
    <radialGradient id="spiderRadial" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#e62429" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Web Line Pattern Glow Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&amp;family=Rajdhani:wght@600;700&amp;family=JetBrains+Mono:wght@500;700&amp;display=swap');
      
      .title-main {
        font-family: 'Orbitron', 'Impact', sans-serif;
        font-weight: 900;
        font-size: 54px;
        letter-spacing: 6px;
        fill: #ffffff;
      }
      
      .title-subtitle {
        font-family: 'Rajdhani', sans-serif;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 4px;
        fill: #00d2ff;
        text-transform: uppercase;
      }

      .tech-mono {
        font-family: 'JetBrains Mono', monospace;
        font-size: 13px;
        letter-spacing: 2px;
        fill: #e62429;
      }

      /* Pulsing Spider Sense Wave */
      @keyframes radarPulse {
        0% { r: 10px; opacity: 0.8; stroke-width: 2px; }
        50% { opacity: 0.4; }
        100% { r: 240px; opacity: 0; stroke-width: 1px; }
      }

      @keyframes webPulse {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.7; }
      }

      @keyframes laserTravel {
        0% { stroke-dashoffset: 600; }
        100% { stroke-dashoffset: -600; }
      }

      @keyframes statusBlink {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.3; transform: scale(0.85); }
      }

      @keyframes floatSpider {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }

      .radar-ring-1 {
        animation: radarPulse 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite;
        transform-origin: 600px 95px;
      }
      .radar-ring-2 {
        animation: radarPulse 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 1.3s;
        transform-origin: 600px 95px;
      }
      .radar-ring-3 {
        animation: radarPulse 4s cubic-bezier(0.1, 0.8, 0.3, 1) infinite 2.6s;
        transform-origin: 600px 95px;
      }

      .web-pulse-line {
        animation: webPulse 3s ease-in-out infinite;
      }

      .laser-web {
        stroke-dasharray: 80 400;
        animation: laserTravel 6s linear infinite;
      }

      .spider-emblem-wrap {
        animation: floatSpider 4s ease-in-out infinite;
        transform-origin: 600px 95px;
      }

      .pulse-dot {
        animation: statusBlink 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" stroke="#1f293d" stroke-width="2"/>

  <!-- Radial Glow Behind Spider Emblem -->
  <circle cx="600" cy="95" r="220" fill="url(#spiderRadial)"/>
  <circle cx="100" cy="50" r="180" fill="url(#spiderRadial)" opacity="0.3"/>
  <circle cx="1100" cy="320" r="180" fill="url(#spiderRadial)" opacity="0.3"/>

  <!-- High-Tech Spider Web Grid Background -->
  <g opacity="0.45" class="web-pulse-line">
    <!-- Concentric Web Hexagons / Circles from center top -->
    <circle cx="600" cy="95" r="60" fill="none" stroke="#e62429" stroke-width="1.2" stroke-dasharray="3 4"/>
    <circle cx="600" cy="95" r="120" fill="none" stroke="#e62429" stroke-width="1" stroke-dasharray="4 6"/>
    <circle cx="600" cy="95" r="190" fill="none" stroke="#e62429" stroke-width="1" stroke-dasharray="5 7"/>
    <circle cx="600" cy="95" r="280" fill="none" stroke="#e62429" stroke-width="0.8" stroke-dasharray="6 8"/>
    <circle cx="600" cy="95" r="390" fill="none" stroke="#00d2ff" stroke-width="0.6" stroke-dasharray="4 8" opacity="0.6"/>

    <!-- Radiating Web Spoke Rays -->
    <line x1="600" y1="95" x2="100" y2="20" stroke="#e62429" stroke-width="1.2"/>
    <line x1="600" y1="95" x2="250" y2="0" stroke="#e62429" stroke-width="1"/>
    <line x1="600" y1="95" x2="420" y2="0" stroke="#e62429" stroke-width="1"/>
    <line x1="600" y1="95" x2="780" y2="0" stroke="#e62429" stroke-width="1"/>
    <line x1="600" y1="95" x2="950" y2="0" stroke="#e62429" stroke-width="1"/>
    <line x1="600" y1="95" x2="1100" y2="20" stroke="#e62429" stroke-width="1.2"/>

    <line x1="600" y1="95" x2="50" y2="140" stroke="#e62429" stroke-width="1"/>
    <line x1="600" y1="95" x2="1150" y2="140" stroke="#e62429" stroke-width="1"/>

    <line x1="600" y1="95" x2="150" y2="350" stroke="#e62429" stroke-width="1"/>
    <line x1="600" y1="95" x2="350" y2="380" stroke="#e62429" stroke-width="0.8"/>
    <line x1="600" y1="95" x2="850" y2="380" stroke="#e62429" stroke-width="0.8"/>
    <line x1="600" y1="95" x2="1050" y2="350" stroke="#e62429" stroke-width="1"/>
  </g>

  <!-- Animated Laser Web Circuit Streams -->
  <g>
    <line x1="0" y1="95" x2="1200" y2="95" stroke="#00d2ff" stroke-width="1.5" class="laser-web" opacity="0.75" filter="url(#glowFilter)"/>
    <line x1="600" y1="0" x2="600" y2="380" stroke="#e62429" stroke-width="1.5" class="laser-web" opacity="0.6" filter="url(#glowFilter)"/>
  </g>

  <!-- Animated Spider-Sense Radar Ripples -->
  <circle cx="600" cy="95" r="10" fill="none" stroke="#e62429" class="radar-ring-1" filter="url(#glowFilter)"/>
  <circle cx="600" cy="95" r="10" fill="none" stroke="#00d2ff" class="radar-ring-2" filter="url(#glowFilter)"/>
  <circle cx="600" cy="95" r="10" fill="none" stroke="#ff1744" class="radar-ring-3" filter="url(#glowFilter)"/>

  <!-- High-Tech Stark HUD Corner Brackets -->
  <g stroke="#00d2ff" stroke-width="2.5" fill="none" opacity="0.85">
    <!-- Top-Left -->
    <path d="M 30 55 L 30 30 L 55 30"/>
    <circle cx="30" cy="30" r="2.5" fill="#00d2ff"/>
    <text x="65" y="42" class="tech-mono" font-size="11" fill="#00d2ff" opacity="0.9">SYS.SPIDER_OS // v2.0</text>

    <!-- Top-Right -->
    <path d="M 1170 55 L 1170 30 L 1145 30"/>
    <circle cx="1170" cy="30" r="2.5" fill="#e62429"/>
    <text x="1005" y="42" class="tech-mono" font-size="11" fill="#e62429" opacity="0.9">NET.SECURITY // OK</text>

    <!-- Bottom-Left -->
    <path d="M 30 325 L 30 350 L 55 350"/>
    <circle cx="30" cy="350" r="2.5" fill="#e62429"/>
    <text x="65" y="346" class="tech-mono" font-size="11" fill="#8892b0">HYDERABAD, IN [17.3850° N, 78.4867° E]</text>

    <!-- Bottom-Right -->
    <path d="M 1170 325 L 1170 350 L 1145 350"/>
    <circle cx="1170" cy="350" r="2.5" fill="#00d2ff"/>
    <text x="965" y="346" class="tech-mono" font-size="11" fill="#00d2ff">MULTIVERSE_ID #078</text>
  </g>

  <!-- Center Floating Spider Insignia -->
  <g class="spider-emblem-wrap" filter="url(#intenseGlow)">
    <!-- Spider Body Shield -->
    <circle cx="600" cy="95" r="32" fill="#0a0e1a" stroke="#e62429" stroke-width="3"/>
    <circle cx="600" cy="95" r="26" fill="#0e1322" stroke="#00d2ff" stroke-width="1.5"/>

    <!-- Marvel Spider Silhouette Icon -->
    <g transform="translate(600, 95) scale(0.62) translate(-25, -25)">
      <!-- Head & Abdomen -->
      <ellipse cx="25" cy="18" rx="4.5" ry="6" fill="#ffffff"/>
      <ellipse cx="25" cy="32" rx="7" ry="11" fill="#e62429"/>
      
      <!-- Spider Legs (Upper Left) -->
      <path d="M 23 16 Q 10 4 6 12 Q 13 14 21 19" fill="#ffffff"/>
      <path d="M 21 21 Q 6 15 2 26 Q 10 25 20 23" fill="#ffffff"/>
      <!-- Spider Legs (Lower Left) -->
      <path d="M 20 28 Q 5 36 6 48 Q 12 39 21 33" fill="#e62429"/>
      <path d="M 21 34 Q 9 46 12 55 Q 16 46 23 38" fill="#e62429"/>
      
      <!-- Spider Legs (Upper Right) -->
      <path d="M 27 16 Q 40 4 44 12 Q 37 14 29 19" fill="#ffffff"/>
      <path d="M 29 21 Q 44 15 48 26 Q 40 25 30 23" fill="#ffffff"/>
      <!-- Spider Legs (Lower Right) -->
      <path d="M 30 28 Q 45 36 44 48 Q 38 39 29 33" fill="#e62429"/>
      <path d="M 29 34 Q 41 46 38 55 Q 34 46 27 38" fill="#e62429"/>
    </g>
  </g>

  <!-- Typography Content -->
  <!-- Name with Spider-Verse Chromatic Aberration / Offset Glow -->
  <g text-anchor="middle">
    <!-- Red Glitch Layer -->
    <text x="603" y="197" class="title-main" fill="#e62429" opacity="0.65">KADARI KAUSHIK</text>
    <!-- Cyan Glitch Layer -->
    <text x="597" y="195" class="title-main" fill="#00d2ff" opacity="0.65">KADARI KAUSHIK</text>
    <!-- Main Crisp White Layer -->
    <text x="600" y="196" class="title-main">KADARI KAUSHIK</text>

    <!-- Professional Hero Subtitle -->
    <text x="600" y="235" class="title-subtitle">
      FRIENDLY NEIGHBORHOOD SOFTWARE &amp; AI ENGINEER
    </text>

    <!-- Tagline Bar -->
    <g transform="translate(600, 268)">
      <!-- Central Tag Pill Container -->
      <rect x="-370" y="-18" width="740" height="36" rx="18" fill="#0d1424" stroke="#1e293b" stroke-width="1.5"/>

      <!-- Items with Dot Separators -->
      <g class="pulse-dot">
        <circle cx="-335" cy="0" r="5" fill="#00f5d4"/>
      </g>
      <text x="-320" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" font-weight="600" text-anchor="start">
        CSE (AI &amp; ML) '25
      </text>

      <text x="-190" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e62429" font-weight="700">✦</text>

      <text x="-165" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" font-weight="600" text-anchor="start">
        DEEP LEARNING &amp; COMPUTER VISION
      </text>

      <text x="105" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00d2ff" font-weight="700">✦</text>

      <text x="130" y="5" font-family="'JetBrains Mono', monospace" font-size="12" fill="#e2e8f0" font-weight="600" text-anchor="start">
        DJANGO &amp; FULL-STACK SYSTEMS
      </text>
    </g>

    <!-- Bottom Quote -->
    <text x="600" y="312" font-family="'Rajdhani', sans-serif" font-size="14" fill="#94a3b8" letter-spacing="3" font-weight="600">
      &quot;WITH GREAT TECH STACK COMES GREAT RESPONSIBILITY&quot;
    </text>
  </g>
</svg>
