<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 36" width="100%" height="36">
  <defs>
    <linearGradient id="divLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e62429" stop-opacity="0"/>
      <stop offset="25%" stop-color="#e62429" stop-opacity="0.4"/>
      <stop offset="45%" stop-color="#ff1744" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#00d2ff" stop-opacity="1"/>
      <stop offset="55%" stop-color="#ff1744" stop-opacity="0.9"/>
      <stop offset="75%" stop-color="#e62429" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#e62429" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes pulseSpider {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 1; filter: drop-shadow(0 0 6px #00d2ff); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: -400; }
      }
      .spider-center {
        animation: pulseSpider 2.5s ease-in-out infinite;
        transform-origin: 450px 18px;
      }
      .laser-beam {
        stroke-dasharray: 60 200;
        animation: beamMove 4s linear infinite;
      }
    </style>
  </defs>

  <!-- Base Line -->
  <line x1="20" y1="18" x2="880" y2="18" stroke="url(#divLineGrad)" stroke-width="2" filter="url(#divGlow)"/>

  <!-- Animated Laser Beams travelling across the web -->
  <line x1="50" y1="18" x2="850" y2="18" stroke="#00d2ff" stroke-width="1.8" class="laser-beam" opacity="0.8" filter="url(#divGlow)"/>

  <!-- Secondary subtle web cords -->
  <path d="M 380 18 Q 450 8 520 18" fill="none" stroke="#e62429" stroke-width="1" opacity="0.6"/>
  <path d="M 380 18 Q 450 28 520 18" fill="none" stroke="#e62429" stroke-width="1" opacity="0.6"/>

  <!-- Central Spider Icon -->
  <g class="spider-center">
    <circle cx="450" cy="18" r="14" fill="#0d1424" stroke="#e62429" stroke-width="1.8"/>
    <circle cx="450" cy="18" r="10" fill="#121b30" stroke="#00d2ff" stroke-width="1"/>
    
    <!-- Mini Spider Silhouette -->
    <ellipse cx="450" cy="16" rx="2" ry="2.5" fill="#ffffff"/>
    <ellipse cx="450" cy="21" rx="2.5" ry="4" fill="#e62429"/>
    <!-- Left Legs -->
    <path d="M 449 16 Q 444 12 443 14" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 449 19 Q 443 17 442 20" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 449 22 Q 443 25 444 28" stroke="#e62429" stroke-width="0.8" fill="none"/>
    <!-- Right Legs -->
    <path d="M 451 16 Q 456 12 457 14" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 451 19 Q 457 17 458 20" stroke="#ffffff" stroke-width="0.8" fill="none"/>
    <path d="M 451 22 Q 457 25 456 28" stroke="#e62429" stroke-width="0.8" fill="none"/>
  </g>
</svg>
